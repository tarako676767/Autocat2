<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>AUTOCAT JP Chat</title>
  <style>
    @font-face{font-family:Kogoe;src:url('/static/fonts/Kogoe-Light.ttf') format('truetype');font-display:swap}
    :root{--bg:#090b11;--surface:#11151f;--surface2:#171c28;--line:#263044;--text:#edf4ff;--muted:#8d9bb0;--blue:#38bdf8;--blue2:#7dd3fc;--red:#fb7185;--green:#4ade80;--shadow:0 20px 55px rgba(0,0,0,.4)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(56,189,248,.1),transparent 32%),var(--bg);color:var(--text);font-family:Kogoe,system-ui,sans-serif;overflow:hidden}
    button,input,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;max-width:980px;margin:auto;background:rgba(9,11,17,.66);border-inline:1px solid rgba(38,48,68,.65)}
    header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(17,21,31,.9);backdrop-filter:blur(15px)}
    .brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--blue)}.spacer{flex:1}.identity{font-size:12px;color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px;padding:8px 12px;text-decoration:none;cursor:pointer}.btn:hover{border-color:var(--blue);color:var(--blue2)}
    .notice{display:none;align-items:center;gap:10px;margin:10px 14px 0;padding:12px 14px;background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.35);border-radius:11px;font-size:12px}.notice.show{display:flex}.notice strong{color:var(--blue2)}.notice .btn{margin-left:auto;white-space:nowrap}
    .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;margin:12px 14px 0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.tab{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;cursor:pointer;font-weight:700}.tab.active{background:var(--surface2);color:var(--blue2);box-shadow:0 4px 16px rgba(0,0,0,.28)}
    .restriction{display:none;margin:10px 14px 0;padding:12px 14px;border:1px solid var(--red);background:rgba(251,113,133,.09);border-radius:11px;color:#fecdd3;font-size:12px;line-height:1.6}.restriction.show{display:block}.unlock-code{display:inline-block;margin-top:6px;padding:5px 8px;background:#090b11;border:1px solid rgba(251,113,133,.5);border-radius:7px;font:700 13px ui-monospace,monospace;letter-spacing:.08em;user-select:all}
    .messages{overflow-y:auto;padding:16px 14px 30px;scroll-behavior:smooth}.empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px}.message{display:grid;grid-template-columns:38px 1fr auto;gap:10px;padding:12px 8px;border-bottom:1px solid rgba(38,48,68,.6)}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#243047,#121722);display:grid;place-items:center;color:var(--blue2);font-size:12px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.meta{display:flex;align-items:center;gap:7px;min-width:0}.name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.id{font:10px ui-monospace,monospace;color:var(--muted)}.admin-badge{font-size:9px;border:1px solid rgba(56,189,248,.5);color:var(--blue2);padding:2px 6px;border-radius:99px}.time{font-size:10px;color:var(--muted)}.content{margin-top:5px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.deleted{color:var(--muted);font-style:italic}.actions{display:flex;flex-direction:column;align-items:flex-end}.delete{border:0;background:transparent;color:var(--muted);padding:4px;cursor:pointer;white-space:nowrap}.delete:hover{color:var(--red)}.dm-head{display:flex;align-items:center;gap:10px;padding:4px 4px 13px;border-bottom:1px solid var(--line)}.dm-head strong{font-size:13px}.conversation{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;width:100%;padding:13px 8px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left;cursor:pointer}.conversation:hover{background:rgba(56,189,248,.06)}.conversation .preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
    .composer-wrap{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(17,21,31,.94)}.readonly{display:none;text-align:center;color:var(--muted);font-size:12px;padding:10px}.post-options{display:none;align-items:center;gap:9px;margin:0 0 9px;color:var(--muted);font-size:11px}.post-options.show{display:flex}.post-options select{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;outline:none}.post-options select:focus{border-color:var(--blue)}.composer{display:grid;grid-template-columns:1fr auto;gap:10px}.composer textarea{resize:none;min-height:46px;max-height:120px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px;outline:none}.composer textarea:focus{border-color:var(--blue)}.send{border:0;border-radius:11px;background:var(--blue);color:#02131c;font-weight:900;padding:0 18px;cursor:pointer}.send:disabled{opacity:.45;cursor:not-allowed}.helper{margin-top:7px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between}.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;z-index:10;max-width:min(520px,90vw);padding:11px 16px;background:#161d2a;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{border-color:var(--red);color:#fecdd3}
    @media(max-width:600px){header{padding:11px 12px}.identity{display:none}.brand{font-size:14px}.btn{padding:7px 9px;font-size:11px}.message{grid-template-columns:34px 1fr auto;padding-inline:2px}.avatar{width:34px;height:34px}.id{display:none}.content{font-size:13px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <a class="btn" href="{{ '/vip' if user and user.is_vip else '/' }}">← 戻る</a>
    <div class="brand">AUTOCAT <span>JP CHAT</span></div>
    <div class="spacer"></div>
    <div id="identity" class="identity">接続中...</div>
    {% if is_chat_admin %}<a class="btn" href="/chat/admin">管理</a>{% endif %}
    {% if user %}
      <a class="btn" href="/auth/logout?next=/chat">Discordログアウト</a>
    {% else %}
      <a class="btn" href="/auth/login?next=/chat">Discordログイン</a>
    {% endif %}
  </header>

  <div>
    <div id="notification-notice" class="notice">
      <div><strong>運営通知</strong><br>管理者チャットの新着通知を受け取れます。</div>
      <button id="notification-button" class="btn" type="button">通知をオンにする</button>
    </div>
    <nav class="tabs" aria-label="チャットルーム">
      <button class="tab active" type="button" data-room="free">フリーチャット</button>
      <button class="tab" type="button" data-room="admin">管理者チャット</button>
      <button class="tab" type="button" data-room="dm">DM</button>
    </nav>
    <div id="restriction" class="restriction"></div>
  </div>

  <main id="messages" class="messages" aria-live="polite">
    <div class="empty">メッセージを読み込んでいます...</div>
  </main>

  <footer class="composer-wrap">
    <div id="readonly" class="readonly">管理者チャットは運営のみ投稿できます。</div>
    <div id="admin-post-options" class="post-options">
      <label for="notify-mode">通知設定</label>
      <select id="notify-mode">
        <option value="on">通知あり（ブラウザ＋Discord @everyone）</option>
        <option value="off">通知なし（Discord転送のみ・@everyoneなし）</option>
      </select>
    </div>
    <form id="composer" class="composer">
      <textarea id="message-input" maxlength="300" placeholder="メッセージを入力" aria-label="メッセージ"></textarea>
      <button id="send-button" class="send" type="submit">送信</button>
    </form>
    <div class="helper"><span>URLは2件まで・投稿間隔3秒</span><span>毎日0:00に履歴リセット</span></div>
  </footer>
</div>
<div id="toast" class="toast"></div>
<script>
window.CHAT_CONFIG={{ {
  'csrfToken': csrf_token,
  'vapidPublicKey': vapid_public_key,
  'serverAdmin': is_chat_admin,
  'discordLoggedIn': user is not none
}|tojson }};
</script>
<script src="/chat-assets/chat.js?v=20260829-1" defer></script>
</body>
</html>
