<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>アクセス確認 | AUTOCAT JP</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#090b11;color:#edf4ff;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}.card{width:min(410px,calc(100% - 28px));padding:26px;border:1px solid #293247;border-radius:16px;background:#11151f;text-align:center}.brand{font-weight:900;letter-spacing:.05em}.brand span{color:#38bdf8}p{margin:14px 0 0;color:#8d9bb0;font-size:13px;line-height:1.7}.spinner{width:30px;height:30px;margin:22px auto 0;border:3px solid #293247;border-top-color:#38bdf8;border-radius:50%;animation:spin .7s linear infinite}.error{color:#fecdd3}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">AUTOCAT <span>JP</span></div>
    <p id="message">アクセスを確認しています。少しお待ちください。</p>
    <div class="spinner" aria-hidden="true"></div>
    <form id="access-form" method="post" action="/api/access/identify">
      <input type="hidden" name="nonce" value="{{ nonce }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <input id="access-fingerprint" type="hidden" name="fingerprint">
    </form>
  </main>
  <script>
    'use strict';
    async function browserFingerprint(){
      let installId='';
      try{installId=localStorage.getItem('autocat_install_id_v1')||'';if(!/^[0-9a-f]{32}$/.test(installId)){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);installId=[...bytes].map(v=>v.toString(16).padStart(2,'0')).join('');localStorage.setItem('autocat_install_id_v1',installId);}}catch{installId='storage-unavailable';}
      let canvas='';
      try{const c=document.createElement('canvas');c.width=220;c.height=45;const x=c.getContext('2d');x.font='15px Arial';x.fillStyle='#38bdf8';x.fillText('AUTOCAT JP ACCOUNT',4,20);canvas=c.toDataURL();}catch{}
      const signals=[installId,navigator.userAgent,navigator.platform,navigator.language,(navigator.languages||[]).join(','),navigator.hardwareConcurrency||0,navigator.deviceMemory||0,navigator.maxTouchPoints||0,screen.width||0,screen.height||0,screen.colorDepth||0,Intl.DateTimeFormat().resolvedOptions().timeZone||'',canvas].join('||');
      if(crypto.subtle&&window.TextEncoder){const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(signals));return [...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join('');}
      throw new Error('このブラウザではアクセスを確認できません。');
    }
    document.addEventListener('DOMContentLoaded',async()=>{const message=document.getElementById('message');try{document.getElementById('access-fingerprint').value=await browserFingerprint();document.getElementById('access-form').submit();}catch(error){message.textContent=error.message||'アクセス確認に失敗しました。';message.className='error';document.querySelector('.spinner').hidden=true;}});
  </script>
</body>
</html>
