<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark">
  <title>VIP管理 | AUTOCAT JP</title>
  <style>
    :root{--bg:#090b11;--surface:#11151f;--surface2:#171c28;--line:#293247;--text:#edf4ff;--muted:#8d9bb0;--blue:#38bdf8;--gold:#facc15;--red:#fb7185;--green:#4ade80}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(250,204,21,.06),transparent 28%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}button,input,select,textarea{font:inherit}a{text-decoration:none;color:inherit}
    header{display:flex;align-items:center;gap:10px;padding:13px max(14px,calc((100vw - 1240px)/2));border-bottom:1px solid var(--line);background:rgba(9,11,17,.92);position:sticky;top:0;z-index:10}.brand{font-weight:900}.brand span{color:var(--gold)}.spacer{flex:1}.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text);font-size:11px;font-weight:800;cursor:pointer}.btn:hover{border-color:var(--blue)}.primary{border:0;background:var(--blue);color:#03141d}.danger{color:#fecdd3;border-color:rgba(251,113,133,.35)}
    main{width:min(1240px,calc(100% - 24px));margin:18px auto 70px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:2px;font-size:24px}
    .grant{display:grid;grid-template-columns:minmax(220px,1fr) 180px minmax(220px,1fr) auto;align-items:end;gap:8px;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.field{display:grid;gap:5px;min-width:0}.field span{color:var(--muted);font-size:9px;font-weight:800}.grant-actions{display:flex;gap:6px}input,select,textarea{min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue)}
    .workspace{display:grid;grid-template-columns:390px 1fr;gap:12px;margin-top:12px}.panel{min-width:0;border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden}.panel-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:13px}.filter{width:180px;padding:7px 9px;font-size:10px}.tabs{display:flex;gap:5px}.tab{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);font-size:10px;cursor:pointer}.tab.active{border-color:var(--blue);color:var(--blue);background:rgba(56,189,248,.08)}.list{max-height:640px;overflow:auto;padding:6px}.ticket{display:block;width:100%;padding:11px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left;cursor:pointer}.ticket:hover,.ticket.active{background:rgba(56,189,248,.07)}.ticket-top{display:flex;align-items:center;gap:7px}.ticket-name{font-weight:800;font-size:12px}.ticket-key{color:var(--blue);font:800 10px ui-monospace,monospace}.ticket-meta{display:flex;align-items:center;gap:7px;margin-top:5px;color:var(--muted);font-size:9px}.unread{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--blue);color:#03141d;font-size:9px;font-weight:900}.badge{margin-left:auto;padding:3px 6px;border:1px solid var(--line);border-radius:99px;font-size:9px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:11px}
    .detail{min-height:580px;display:grid;grid-template-rows:auto auto auto auto auto minmax(220px,1fr) auto}.detail-head{padding:13px 15px;border-bottom:1px solid var(--line)}.detail-title{display:flex;align-items:center;gap:8px}.detail-title h2{margin:0;font-size:14px}.detail-title .delete-ticket{margin-left:auto}.ids{display:flex;flex-wrap:wrap;gap:10px;margin-top:7px;color:var(--muted);font-size:10px}.ids code{color:var(--blue);user-select:all}.order-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.order-strip div{padding:9px 12px;background:var(--surface2)}.order-strip span{display:block;color:var(--muted);font-size:8px}.order-strip strong{display:block;margin-top:2px;font-size:12px}.order-strip .price{color:var(--gold)}.next-action{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px;border-bottom:1px solid rgba(250,204,21,.24);background:rgba(250,204,21,.07)}.next-action div{min-width:180px;flex:1}.next-action span{display:block;color:var(--gold);font-size:9px;font-weight:900}.next-action strong{display:block;margin-top:2px;font-size:12px}.paypay-card{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;border-bottom:1px solid var(--line);background:rgba(56,189,248,.06)}.paypay-card code{min-width:180px;flex:1;overflow:hidden;text-overflow:ellipsis;color:var(--blue);font-size:10px;white-space:nowrap;user-select:all}.manual-status{margin-top:9px}.manual-status summary{color:var(--muted);font-size:10px;cursor:pointer}.status-row,.quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.quick-row{padding:8px 11px;margin:0;border-bottom:1px solid var(--line);background:#0d1018}.quick-row .btn{width:70px;min-width:70px;height:40px;padding:3px;font-size:10px;line-height:1.15;text-align:center;white-space:normal}.messages{min-height:260px;max-height:440px;overflow:auto;padding:15px}.message{max-width:78%;margin-bottom:10px}.message.admin{margin-left:auto}.bubble{padding:9px 11px;border:1px solid var(--line);border-radius:11px 11px 11px 3px;background:var(--surface2);font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.message.admin .bubble{border-color:rgba(56,189,248,.3);border-radius:11px 11px 3px 11px;background:rgba(56,189,248,.1)}.message.system{max-width:100%;text-align:center}.message.system .bubble{display:inline-block;border-radius:9px;color:var(--muted);font-size:9px}.sender{margin:0 3px 3px;color:var(--muted);font-size:9px}.message.admin .sender{text-align:right}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px;border-top:1px solid var(--line)}textarea{resize:none;min-height:45px;max-height:90px}.side-panels{display:none}.side-panels.active{display:block}.subscriber,.account-row{display:grid;grid-template-columns:1fr auto;gap:9px;padding:11px 10px;border-bottom:1px solid var(--line)}.subscriber strong,.account-row strong{font-size:12px}.subscriber code,.account-row code{display:block;margin-top:3px;color:var(--blue);font-size:10px}.subscriber small,.account-row small{display:block;color:var(--muted);font-size:9px}.account-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}.account-actions .btn{width:70px;height:40px;padding:3px;font-size:10px;line-height:1.15;text-align:center;white-space:normal}.account-state{display:inline-block;margin-top:4px;padding:2px 6px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:9px}.account-state.active{color:var(--green);border-color:rgba(74,222,128,.35)}.account-state.suspended,.account-state.banned,.account-state.gban,.account-state.deleted{color:#fecdd3;border-color:rgba(251,113,133,.35)}.account-state.gban{background:rgba(251,113,133,.12);font-weight:900}.status{min-height:18px;margin:8px 2px 0;color:var(--green);font-size:11px}.status.error{color:#fecdd3}.notify.on{color:var(--green);border-color:rgba(74,222,128,.4)}
    @media(max-width:850px){.grant{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.list{max-height:300px}.detail{min-height:540px}.hide-mobile{display:none}}@media(max-width:520px){main{width:calc(100% - 14px)}.metrics{grid-template-columns:1fr 1fr}.grant{grid-template-columns:1fr}.grant-actions .btn{flex:1}.filter{order:3;width:100%}.messages{height:320px}.message{max-width:92%}.order-strip{grid-template-columns:1fr 1fr}.order-strip div:last-child{grid-column:1/-1}}
  </style>
</head>
<body>
<header><a class="btn" href="/admin/panel">← 管理パネル</a><div class="brand">AUTOCAT <span>VIP ADMIN</span></div><div class="spacer"></div><button id="notify" class="btn notify" type="button">DM通知をオン</button><a class="btn hide-mobile" href="/chat/admin">チャット管理</a></header>
<main>
  <section class="metrics"><div class="metric"><span>サイトアカウント</span><strong id="metric-accounts">—</strong></div><div class="metric"><span>VIP契約中</span><strong id="metric-vip">—</strong></div><div class="metric"><span>対応待ち申請</span><strong id="metric-pending">—</strong></div><div class="metric"><span>30日間の申請→付与率</span><strong id="metric-conversion">—</strong></div></section>
  <form id="grant-form" class="grant"><label class="field"><span>対象のサイトID</span><input id="grant-id" maxlength="16" placeholder="16桁のサイトID" required></label><label class="field"><span>VIP期間</span><select id="grant-days">{% for plan in plans %}<option value="{{ plan.days }}">{{ plan.days }}日・{{ '{:,}'.format(plan.price_yen) }}円</option>{% endfor %}</select></label><label class="field"><span>購入KEY（任意）</span><input id="grant-key" maxlength="16" placeholder="申請を選ぶと自動入力"></label><div class="grant-actions"><button class="btn primary" type="submit">VIP付与・延長</button><button id="revoke-by-id" class="btn danger" type="button">VIP剥奪</button></div></form><div id="status" class="status"></div>
  <div class="workspace">
    <section class="panel"><div class="panel-head"><h2>管理一覧</h2><div class="spacer"></div><div class="tabs"><button id="tab-unhandled" class="tab active" type="button" data-view="tickets" data-status="unhandled">未対応</button><button id="tab-working" class="tab" type="button" data-view="tickets" data-status="working">対応中</button><button id="tab-done" class="tab" type="button" data-view="tickets" data-status="done">対応済</button><button id="tab-deleted" class="tab" type="button" data-view="tickets" data-status="deleted">削除済み</button><button id="tab-vip" class="tab" type="button" data-view="subscribers">VIP</button><button id="tab-accounts" class="tab" type="button" data-view="accounts">アカウント</button></div><input id="account-filter" class="filter" type="search" placeholder="ID・名前・購入KEYで検索"></div><div id="tickets" class="list side-panels active"><div class="empty">読み込み中...</div></div><div id="subscribers" class="list side-panels"><div class="empty">読み込み中...</div></div><div id="accounts" class="list side-panels"><div class="empty">読み込み中...</div></div></section>
    <section id="detail" class="panel detail"><div class="empty">左の購入申請を選択してください。</div></section>
  </div>
</main>
<script>window.VIP_ADMIN_CONFIG={{ {'csrfToken':csrf_token,'selectedKey':selected_key,'vapidPublicKey':vapid_public_key,'plans':plans,'paymentGuide':payment_guide}|tojson }};</script>
<script src="/static/vip-admin.js?v=20260901-4" defer></script>
</body>
</html>
